<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Details Form - VVIT</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: #1e293b;
      padding: 30px 16px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 32px 40px;
    }

    /* Clean, Professional University Header */
    .form-header {
      text-align: center;
      border-bottom: 2px solid #1e3a8a;
      padding-bottom: 16px;
      margin-bottom: 28px;
    }

    .form-header h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e3a8a;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      line-height: 1.4;
    }

    .form-header h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #334155;
      margin-top: 6px;
    }

    /* Verification Card */
    .card {
      background: #ffffff;
      border-radius: 8px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
      align-items: start;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full-col {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    .req {
      color: #ef4444;
    }

    .form-group input,
    .form-group select {
      padding: 10px 14px;
      font-size: 0.9rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
      background-color: #fff;
      color: #0f172a;
      transition: all 0.2s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #1e3a8a;
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.12);
    }

    .form-group input::placeholder {
      color: #94a3b8;
      font-size: 0.82rem;
    }

    .input-readonly {
      background-color: #f8fafc !important;
      color: #64748b !important;
      cursor: not-allowed;
    }

    /* Button Styles */
    .btn-primary {
      background-color: #1e3a8a;
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-block;
      transition: background-color 0.15s ease;
    }

    .btn-primary:hover {
      background-color: #1e40af;
    }

    .btn-primary:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .btn-success {
      background-color: #059669;
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
    }

    .btn-secondary {
      background-color: #64748b;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .form-actions {
      text-align: center;
      margin-top: 24px;
    }

    /* Alert / Notice Messages */
    .alert-box {
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .alert-box.error {
      background-color: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .alert-box.success {
      background-color: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    /* Form Sections */
    .form-section {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 20px 24px;
      margin-bottom: 22px;
    }

    .form-section legend {
      font-weight: 600;
      color: #1e3a8a;
      padding: 0 8px;
      font-size: 1rem;
    }

    .section-subtext {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 16px;
    }

    /* Centered Upload Containers */
    .upload-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 650px) {
      .upload-container {
        grid-template-columns: 1fr;
      }
      .container {
        padding: 20px 16px;
      }
    }

    .upload-card {
      border: 1.5px dashed #cbd5e1;
      border-radius: 8px;
      padding: 18px;
      text-align: center;
      background-color: #f8fafc;
    }

    .upload-card h4 {
      font-size: 0.85rem;
      color: #334155;
      margin-bottom: 12px;
    }

    .upload-dropzone {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .upload-dropzone input[type="file"] {
      font-size: 0.85rem;
      color: #475569;
    }

    .thumb-preview {
      max-width: 110px;
      max-height: 130px;
      margin: 10px auto 4px auto;
      display: block;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
    }

    .combined-preview {
      width: 130px;
      border: 1.5px solid #1e3a8a;
      border-radius: 4px;
    }

    .size-tag {
      font-size: 0.78rem;
      color: #059669;
      font-weight: 500;
    }

    /* A4 Preview Styles */
    .a4-preview-wrapper {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 24px;
      font-size: 0.85rem;
    }

    .preview-header {
      text-align: center;
      border-bottom: 2px solid #1e3a8a;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .preview-header h3 {
      font-size: 1.05rem;
      color: #1e3a8a;
    }

    .preview-header h4 {
      font-size: 0.85rem;
      color: #334155;
    }

    .preview-top-grid {
      display: flex;
      gap: 16px;
      margin-bottom: 10px;
    }

    .preview-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 10px;
    }

    .preview-table th, .preview-table td {
      border: 1px solid #cbd5e1;
      padding: 6px 8px;
      font-size: 0.8rem;
    }

    .preview-table th {
      background-color: #f8fafc;
      color: #1e293b;
      width: 22%;
      text-align: left;
    }

    .preview-photo-box {
      width: 130px;
      flex-shrink: 0;
      text-align: center;
    }

    .preview-photo-box img {
      width: 125px;
      height: 165px;
      border: 1.5px solid #1e3a8a;
      object-fit: cover;
    }

    .preview-declaration {
      font-size: 0.75rem;
      font-style: italic;
      color: #64748b;
      margin-top: 10px;
    }

    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }
      .container {
        box-shadow: none;
        padding: 0;
        max-width: 100%;
      }
      .form-header, .screen-notice, #postSubmitActions {
        display: none !important;
      }
      .a4-preview-wrapper {
        border: none;
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="form-header">
      <h2>Vasireddy Venkatadri International Technological University</h2>
      <h3>Student Details Form</h3>
    </header>

    <!-- ================= STAGE 1: VERIFICATION CARD ================= -->
    <div id="authCard" class="card">
      <div class="form-grid">
        <div class="form-group">
          <label for="authRegdNo">Regd. Number <span class="req">*</span></label>
          <input type="text" id="authRegdNo" 
                 placeholder="Enter your 14 digit Regd No." 
                 maxlength="14" required>
        </div>

        <div class="form-group">
          <label for="authAdmNo">Admission Number <span class="req">*</span></label>
          <input type="text" id="authAdmNo" 
                 placeholder="Enter your 10 digit Admission No. It starts with letters VCO/VON/VOF" 
                 maxlength="10" required>
        </div>

        <div class="form-group">
          <label for="authSection">Section <span class="req">*</span></label>
          <select id="authSection" required>
            <option value="">Select Section</option>
            <option value="CIV-1">CIV-1</option>
            <option value="CIV-2">CIV-2</option>
            <option value="CSE-1">CSE-1</option>
            <option value="CSE-2">CSE-2</option>
            <option value="ECE-1">ECE-1</option>
            <option value="ECE-2">ECE-2</option>
          </select>
        </div>
      </div>

      <div id="authAlert" class="alert-box error" style="display: none;"></div>

      <div class="form-actions">
        <button type="button" id="authBtn" class="btn-primary" onclick="handleAuthVerification()">Verify & Proceed</button>
      </div>
    </div>

    <!-- ================= STAGE 2: MAIN REGISTRATION FORM ================= -->
    <div id="formCard" class="card" style="display: none;">
      
      <div id="welcomeBanner" class="alert-box success" style="display: none; margin-bottom: 20px;">
        <span id="welcomeNameText" style="font-weight: 600;"></span>
      </div>

      <form id="studentRegistrationForm" onsubmit="event.preventDefault(); generateAndShowA4Preview();">
        
        <!-- SECTION 1: ACADEMIC DETAILS -->
        <fieldset class="form-section">
          <legend>1. Academic Identification</legend>
          <div class="form-grid">
            <div class="form-group">
              <label for="fieldEnrollmentNo">Regd. Number</label>
              <input type="text" id="fieldEnrollmentNo" readonly class="input-readonly">
            </div>

            <div class="form-group">
              <label for="fieldAdmissionNo">Admission Number</label>
              <input type="text" id="fieldAdmissionNo" readonly class="input-readonly">
            </div>

            <div class="form-group">
              <label for="fieldProgramme">Programme Admitted</label>
              <input type="text" id="fieldProgramme" value="B.Tech" readonly class="input-readonly">
            </div>

            <div class="form-group">
              <label for="fieldSection">Section</label>
              <input type="text" id="fieldSection" readonly class="input-readonly">
            </div>

            <div class="form-group">
              <label for="fieldAdmissionType">Admission Type <span class="req">*</span></label>
              <select id="fieldAdmissionType" required>
                <option value="Convenor (EAPCET)">Convenor (EAPCET)</option>
                <option value="Management">Management</option>
                <option value="NRI">NRI</option>
              </select>
            </div>

            <div class="form-group">
              <label for="fieldRankHtNo">Rank / Hall Ticket No</label>
              <input type="text" id="fieldRankHtNo" placeholder="Rank or HT No">
            </div>

            <div class="form-group">
              <label for="fieldFeeReimb">Fee Reimbursement <span class="req">*</span></label>
              <select id="fieldFeeReimb" required>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>

            <div class="form-group">
              <label for="fieldApaarId">APAAR ID</label>
              <input type="text" id="fieldApaarId" placeholder="12-digit APAAR ID">
            </div>
          </div>
        </fieldset>

        <!-- SECTION 2: PERSONAL INFORMATION -->
        <fieldset class="form-section">
          <legend>2. Personal Information</legend>
          <div class="form-grid">
            <div class="form-group">
              <label for="fieldNameSsc">Full Name (as per SSC/CBSE/ICSE) <span class="req">*</span></label>
              <input type="text" id="fieldNameSsc" required>
            </div>

            <div class="form-group">
              <label for="fieldGender">Gender <span class="req">*</span></label>
              <select id="fieldGender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="fieldDob">Date of Birth <span class="req">*</span></label>
              <input type="date" id="fieldDob" required>
            </div>

            <div class="form-group">
              <label for="fieldBloodGroup">Blood Group <span class="req">*</span></label>
              <select id="fieldBloodGroup" required>
                <option value="">Select Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
              </select>
            </div>

            <div class="form-group">
              <label for="fieldCategory">Category <span class="req">*</span></label>
              <select id="fieldCategory" required>
                <option value="">Select Category</option>
                <option value="OC">OC</option>
                <option value="BC-A">BC-A</option>
                <option value="BC-B">BC-B</option>
                <option value="BC-C">BC-C</option>
                <option value="BC-D">BC-D</option>
                <option value="BC-E">BC-E</option>
                <option value="SC">SC</option>
                <option value="ST">ST</option>
                <option value="EWS">EWS</option>
              </select>
            </div>

            <div class="form-group">
              <label for="fieldCaste">Sub-Caste <span class="req">*</span></label>
              <input type="text" id="fieldCaste" placeholder="e.g. Kapu, Reddy, Kamma, Mala, etc." required[cite: 13]>
            </div>

            <div class="form-group">
              <label for="fieldStudentMobile">Student Mobile (10-digit) <span class="req">*</span></label>
              <input type="tel" id="fieldStudentMobile" pattern="[0-9]{10}" maxlength="10" required>
            </div>

            <div class="form-group">
